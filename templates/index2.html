<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare Chatbot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #e3f2fd;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
            padding: 20px;
            max-width: 600px;
            width: 100%;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            width: 80px;
        }
        .chat-box {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 5px;
            background: #f9f9f9;
        }
        .chat {
            margin: 10px 0;
            padding: 10px;
            border-radius: 8px;
        }
        .user { background-color: #007bff; color: white; text-align: right; }
        .bot { background-color: #28a745; color: white; text-align: left; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="{{ url_for('static', filename='college_logo.jpg') }}" alt="College Logo" class="logo">
            <h2>Healthcare Chatbot</h2>
        </div>
        <div class="chat-box" id="chat-log"></div>
        <div id="input-box">
            <div id="step-1">
                <input type="number" class="form-control mb-2" id="symptom-count" placeholder="Enter number of symptoms (more than 2)">
                <button class="btn btn-primary w-100" onclick="initializeSymptomInput()">Next</button>
            </div>
            <div id="step-2" style="display:none;">
                <select id="symptom-dropdown" class="form-select mb-2">
                    <option value="" disabled selected>Select a symptom</option>
                </select>
                <button class="btn btn-success w-100 mb-2" onclick="addSymptom()">Add</button>
                <button class="btn btn-info w-100" onclick="submitSymptoms()">Submit</button>
            </div>
            <div id="step-3" style="display:none;">
                <input type="text" class="form-control mb-2" id="allergies" placeholder="Enter any food allergies">
                <button class="btn btn-warning w-100" onclick="submitAllergies()">Submit Allergies</button>
            </div>
        </div>
    </div>
    <script>
        const chatLog = document.getElementById('chat-log');
        let symptoms = [], allergies = [], symptomCount = 0, allSymptoms = [];
        function appendMessage(sender, message) {
            const chatDiv = document.createElement('div');
            chatDiv.className = `chat ${sender === 'user' ? 'user' : 'bot'}`;
            chatDiv.innerHTML = `${sender === 'user' ? 'You' : 'Bot'}:<br>${message}`;
            chatLog.appendChild(chatDiv);
            chatLog.scrollTop = chatLog.scrollHeight;
        }
        async function fetchSymptoms() {
            try {
                const response = await fetch('/get_symptoms');
                const data = await response.json();
                if (response.ok) {
                    allSymptoms = data.symptoms;
                    const dropdown = document.getElementById('symptom-dropdown');
                    allSymptoms.forEach(symptom => {
                        const option = document.createElement('option');
                        option.value = symptom;
                        option.innerText = symptom;
                        dropdown.appendChild(option);
                    });
                } else appendMessage('bot', 'Error fetching symptoms.');
            } catch (error) {
                appendMessage('bot', 'Error communicating with server.');
            }
        }
        function initializeSymptomInput() {
            symptomCount = parseInt(document.getElementById('symptom-count').value, 10);
            if (isNaN(symptomCount) || symptomCount <= 2) {
                appendMessage('bot', 'Enter a valid number greater than two.');
                return;
            }
            appendMessage('bot', `Select ${symptomCount} symptoms.`);
            document.getElementById('step-1').style.display = 'none';
            document.getElementById('step-2').style.display = 'block';
            fetchSymptoms();
        }
        function addSymptom() {
            const symptomDropdown = document.getElementById('symptom-dropdown');
            const symptom = symptomDropdown.value;
            if (!symptom || symptoms.includes(symptom)) return;
            symptoms.push(symptom);
            appendMessage('user', symptom);
            if (symptoms.length === symptomCount) {
                appendMessage('bot', 'Click "Submit".');
                document.getElementById('step-2').style.display = 'none';
                document.getElementById('step-3').style.display = 'block';
            }
        }
        function submitAllergies() {
            const allergyInput = document.getElementById('allergies').value;
            allergies = allergyInput.split(',').map(a => a.trim().toLowerCase());
            appendMessage('user', `Allergies: ${allergies.join(', ')}`);
            appendMessage('bot', 'Processing...');
            fetchPrediction();
        }
        async function fetchPrediction() {
            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ symptoms, allergies })
                });
                const result = await response.json();
                if (response.ok) {
                    result.forEach(item => appendMessage('bot', `Disease: ${item.Disease}<br>Chances: ${item.Chances}%<br>Specialist: ${item.Specialist}<br>Description: ${item.Description}<br>Diet Recommendation: ${item['Diet Recommendation']}`));
                    setTimeout(() => window.location.href = '/predict', 300000);
                } else appendMessage('bot', result.error || 'Error occurred.');
            } catch (error) {
                appendMessage('bot', 'Error connecting to server.');
            }
        }
    </script>
</body>
</html>
